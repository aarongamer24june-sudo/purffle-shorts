name: AI Shorts Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  generate-short:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-3.8-flash
      VISUAL_SOURCES: pollinations
      TTS_ENGINE: edge
      LANGUAGE: en
      NICHES: mind-blowing science facts,unsolved mysteries,space and the universe,psychology tricks,dark history
      TOPIC_SOURCES: niche
      SCRIPT_STYLE: facts
      TARGET_SECONDS: 40
      CAPTION_STYLE: neon
      COLOR_GRADE: vivid
      SYNTHETIC_MEDIA: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install PurffleShorts
        run: pip install -e 
                - name: Generate AI Short
          run: |
            for attempt in 1 2 3 4 5; do
              echo "Attempt $attempt/5"
              
              if python -m purffle_shorts make \
                --source niche \
                --visuals pollinations \
                --count 1 \
                --no-upload; then
                echo "✅ Short generated successfully!"
                exit 0
              fi

              if [ "$attempt" -lt 5 ]; then
                echo "⚠️ Generation failed. Retrying in 60 seconds..."
                sleep 60
              fi
            done

            echo "❌ All 5 attempts failed."
            exit 1
