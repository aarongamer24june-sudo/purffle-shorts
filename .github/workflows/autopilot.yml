name: AI Shorts Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

jobs:
  test-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install PurffleShorts
        run: pip install -e .

      - name: Generate test Short
        run: python -m purffle_shorts demo

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: output_videos/
